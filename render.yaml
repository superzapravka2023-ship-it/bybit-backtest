services:
  - type: web
    name: bybit-backtest
    runtime: docker
    plan: starter          # на free не хватит памяти и сервис засыпает
    region: frankfurt      # ОБЯЗАТЕЛЬНО: Bybit блокирует IP из США
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: cache
      mountPath: /var/data  # кэш скачанной истории
      sizeGB: 2
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: BLACKLIST
        value: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,USDCUSDT,USDEUSDT,TONUSDT,ADAUSDT,TRXUSDT
      - key: LOG_LEVEL
        value: INFO
